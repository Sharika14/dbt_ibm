models:
  - name: stg_nations
    description: Table for nation's data
    columns:
      - name: nation_id
        description: Primary key for this table
        data_tests:
          - unique
          - not_null

  - name: stg_regions
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'ASIA', 'EUROPE', 'AMERICA','MIDDLE EAST']
              config:
                store_failures: TRUE

  - name: stg_orders
    description: Order information
    columns:
      - name: total_price
        data_tests:
          - order_values:
              arguments:
                val: 850
              config:
                store_failures: TRUE



  
