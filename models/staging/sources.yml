sources:
  - name: src
    database: sourcedb
    schema: mkmall
    tables:
      - name: regions
        description: Raw data for regions
      - name: nations 
        description: Raw data for nations
        columns:
          - name: n_nationkey
            data_tests:
              - unique
              - not_null
      - name: customers
      - name: suppliers
      - name: lineitems
      - name: orders
        config:
          freshness:
            warn_after: {count: 6,period: day}
            error_after: {count: 12,period: day}
          loaded_at_field: o_orderdate::timestamp_ntz